<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eshaas - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>✨ Eshaas</h1>
      </div>
      <p class="auth-tagline">Your Emotional Intelligence Companion</p>

      <div id="alertBox" class="alert hidden"></div>

      <!-- Login Form -->
      <div id="loginSection">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Your password" required>
        </div>
        <button class="btn btn-primary" onclick="handleLogin()">Login</button>
        <div class="auth-footer">
          Don't have an account? <a href="#" onclick="toggleForm('signup')">Sign Up</a>
        </div>
      </div>

      <!-- Signup Form -->
      <div id="signupSection" class="hidden">
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" class="form-control" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" class="form-control" placeholder="Choose a password" required>
        </div>
        <button class="btn btn-primary" onclick="handleSignup()">Create Account</button>
        <div class="auth-footer">
          Already have an account? <a href="#" onclick="toggleForm('login')">Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
